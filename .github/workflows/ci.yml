name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────
  # Backend — testes unitários + integração (API)
  # ──────────────────────────────────────────────
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: backend
        # Testcontainers requer Docker — disponível por padrão no ubuntu-latest.
        # Os testes de integração (ApiIntegrationTests) sobem um PostgreSQL 16
        # via Testcontainers sem precisar de service container adicional.
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ──────────────────────────────────────────────
  # Frontend — TypeScript, lint e testes unitários
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22 + Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  # ──────────────────────────────────────────────
  # Docker Compose — validação do build completo
  # ──────────────────────────────────────────────
  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    # Roda só em PRs/pushes para main — evita custo em branches de feature.
    # Para ativar em todos os branches, remova a condição abaixo.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build --parallel

      - name: Smoke test — stack sobe e API responde
        run: |
          docker compose up -d
          echo "Aguardando API ficar saudável..."
          timeout 120 bash -c 'until curl -sf http://localhost:5000/api/dashboard; do sleep 3; done'
          echo ""
          echo "Stack OK — verificando endpoints principais:"
          curl -sf http://localhost:5000/api/companies    | grep '"success":true'
          curl -sf http://localhost:5000/api/alerts       | grep '"success":true'
          curl -sf "http://localhost:5000/api/obligations/calendar?month=$(date +%m)&year=$(date +%Y)" | grep '"success":true'

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v

  # ──────────────────────────────────────────────
  # E2E — Playwright contra a stack completa
  # ──────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend] # só roda se unit/integration passarem
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start stack
        working-directory: .
        run: |
          docker compose up -d --build
          timeout 120 bash -c 'until curl -sf http://localhost:5000/api/dashboard; do sleep 3; done'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Teardown
        if: always()
        working-directory: .
        run: docker compose down -v
