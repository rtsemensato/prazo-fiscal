services:
  postgres:
    image: postgres:16-alpine
    container_name: prazofiscal-postgres
    environment:
      POSTGRES_DB: prazofiscal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d prazofiscal']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: PrazoFiscal.Api/Dockerfile
    container_name: prazofiscal-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=prazofiscal;Username=postgres;Password=postgres
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prazofiscal-frontend
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres_data:
